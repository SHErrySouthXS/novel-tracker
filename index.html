<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="qH1iTF3g1ryJgSY7i4JRLU">
<head data-page-node-id="ggYq3pYb6XOXc0FAAvQfB1">
  <meta charset="UTF-8" data-page-node-id="QEjpv2KqyieXmvc9O473T3">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="W8OCRZxoU3V6ZPcwS1fjye">
  <title>网文平台日榜追踪 · Novel Tracker</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='0.5' y='8' width='4' height='8' rx='0.5' fill='%23e6488a'/><rect x='6' y='4' width='4' height='12' rx='0.5' fill='%23ff6b35'/><rect x='11.5' y='6' width='4' height='10' rx='0.5' fill='%23c83c23'/><rect x='0.5' y='7' width='4' height='1.5' fill='%23ffd700'/><rect x='6' y='3' width='4' height='1.5' fill='%23ffd700'/><rect x='11.5' y='5' width='4' height='1.5' fill='%23ffd700'/></svg>">
  <style>
    /* ===== Web Fonts（MiSans 正文 · 霞鹜文楷标题） ===== */
    @import url("https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Regular.min.css");
    @import url("https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Medium.min.css");
    @import url("https://cdn.jsdelivr.net/npm/misans@4.1.0/lib/Normal/MiSans-Semibold.min.css");
    @import url("https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css");

    :root {
      --bg: #0f1117;
      --card: #1a1d28;
      --card-hover: #222636;
      --border: #2a2e3d;
      --text: #e4e6eb;
      --text-dim: #8b8fa3;
      --accent-fanqie: #ff6b35;
      --accent-qidian: #c83c23;
      --accent-jjwxc: #e6488a;
      --accent-changpei: #6c5ce7;
      --green: #2ecc71;
      --red: #e74c3c;
      --gold: #ffd700;
      --silver: #c0c0c0;
      --bronze: #cd7f32;
      --tag-bg: rgba(255,255,255,0.06);
      --tag-border: rgba(255,255,255,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== 滚动条：细窄半透明，匹配深色玻璃主题（2026-09-09） ===== */
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.16) transparent; }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.10);
      border-radius: 999px;
    }
    *::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.22); }
    *::-webkit-scrollbar-thumb:active { background: rgba(255,255,255,.30); }
    *::-webkit-scrollbar-button { width: 0; height: 0; display: none; }
    *::-webkit-scrollbar-corner { background: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, #1a1d28 0%, #252940 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b35, #e6488a, #c83c23);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-subtitle {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 4px;
    }
    .update-info {
      color: var(--text-dim);
      font-size: 12px;
      margin-top: 6px;
    }

    /* ===== Tab Navigation ===== */
    .tab-nav {
      display: flex;
      gap: 4px;
      margin-top: 16px;
      background: rgba(255,255,255,0.04);
      border-radius: 10px;
      padding: 4px;
      width: fit-content;
    }
    .tab-btn {
      padding: 8px 20px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .tab-btn.active {
      color: #fff;
      font-weight: 600;
    }
    .tab-btn.active[data-tab="dashboard"] { background: linear-gradient(135deg, #667eea, #764ba2); }
    .tab-btn.active[data-tab="fanqie"] { background: var(--accent-fanqie); }
    .tab-btn.active[data-tab="qidian"] { background: var(--accent-qidian); }
    .tab-btn.active[data-tab="jjwxc"] { background: var(--accent-jjwxc); }
    .tab-btn.active[data-tab="changpei"] { background: var(--accent-changpei); }

    /* ===== Main Content ===== */
    .main { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ===== Dashboard ===== */
    .dash-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .dash-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    .dash-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }
    .dash-card.fanqie::before { background: var(--accent-fanqie); }
    .dash-card.qidian::before { background: var(--accent-qidian); }
    .dash-card.jjwxc::before { background: var(--accent-jjwxc); }
    .dash-card.changpei::before { background: var(--accent-changpei); }
    
    .dash-card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .dash-card-subtitle {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }
    .dash-top-list {
      list-style: none;
    }
    .dash-top-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 13px;
    }
    .dash-top-list li:last-child { border-bottom: none; }
    .dash-rank {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .dash-rank.r1 { background: var(--gold); color: #000; }
    .dash-rank.r2 { background: var(--silver); color: #000; }
    .dash-rank.r3 { background: var(--bronze); color: #fff; }
    .dash-rank.rn { background: var(--tag-bg); color: var(--text-dim); }
    .dash-book-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dash-tag {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--tag-bg);
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* ===== Summary Insight Cards — 纯展示样式，不可点击 ===== */
    .insight-section {
      margin-bottom: 24px;
    }
    .insight-section h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }
    .insight-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 12px;
    }
    .insight-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      /* 明确不可点击的视觉风格 */
      cursor: default;
      user-select: text;
    }
    .insight-card-title {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .insight-card-title .icon { font-size: 16px; }
    .insight-card-value {
      font-size: 22px;
      font-weight: 700;
    }
    .insight-card-detail {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ===== 题材分布对比 — 纯展示数据卡片 ===== */
    .tag-distribution {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .tag-dist-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      cursor: default;
    }
    .tag-dist-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag-bar-container {
      margin-bottom: 8px;
    }
    .tag-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 3px;
    }
    .tag-bar-label span:first-child { color: var(--text); }
    .tag-bar-label span:last-child { color: var(--text-dim); }
    .tag-bar {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }
    .tag-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    /* ===== 新上榜作品（三站分列） ===== */
    .new-entries {
      margin-bottom: 24px;
    }
    .new-entries-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .new-entries-column {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .new-entries-column::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }
    .new-entries-column.fanqie::before { background: var(--accent-fanqie); }
    .new-entries-column.qidian::before { background: var(--accent-qidian); }
    .new-entries-column.jjwxc::before { background: var(--accent-jjwxc); }
    .new-entries-col-header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .new-entries-col-count {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .new-entry-item {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: default;
    }
    .new-entry-item:last-child { border-bottom: none; }
    .new-entry-info { flex: 1; min-width: 0; }
    .new-entry-name {
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .new-entry-meta {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .new-entry-rank {
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
      flex-shrink: 0;
    }
    .new-entries-empty {
      font-size: 12px;
      color: var(--text-dim);
      padding: 12px 0;
    }

    /* ===== 站点特点总结 ===== */
    .platform-summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      cursor: default;
    }
    .platform-summary h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .summary-items {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .summary-item {
      padding: 14px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      border-left: 3px solid;
    }
    .summary-item.fanqie { border-left-color: var(--accent-fanqie); }
    .summary-item.qidian { border-left-color: var(--accent-qidian); }
    .summary-item.jjwxc { border-left-color: var(--accent-jjwxc); }
    .summary-item h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .summary-item p {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* ===== Platform Tab (各站独立页面) ===== */
    .platform-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    .platform-title {
      font-size: 20px;
      font-weight: 700;
    }
    .platform-meta {
      font-size: 13px;
      color: var(--text-dim);
    }

    /* ===== 题材统计栏 — 纯展示，非按钮样式 ===== */
    .tag-stats-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: default;
    }

    /* ===== 细分品类模块 — 4 平台统一两级 ===== */
    .subcat-module {
      margin: 0 0 20px 0;
      padding: 16px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .subcat-head-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
      gap: 8px;
    }
    .subcat-module-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      margin: 0;
      letter-spacing: 0.3px;
    }
    .subcat-module-meta {
      font-size: 10px;
      color: var(--text-dim);
    }
    .l1-dist {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 4px;
      margin: -2px 0 14px 0;
      padding: 8px 12px;
      background: rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }
    .l1-dist-title {
      font-size: 10px;
      color: var(--text-dim);
      margin-right: 8px;
      letter-spacing: 0.3px;
    }
    .l1-dist-item {
      display: inline-flex;
      align-items: baseline;
      gap: 3px;
      font-weight: 600;
      white-space: nowrap;
    }
    .l1-dist-pct {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .l1-dist-sep {
      color: var(--text-dim);
      opacity: 0.6;
      padding: 0 3px;
    }
    .subcat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .subcat-card {
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-width: 0;
    }
    .subcat-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--border);
    }
    .subcat-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .subcat-total {
      font-size: 10px;
      color: var(--text-dim);
    }
    .subtag-row {
      margin-bottom: 6px;
    }
    .subtag-row:last-child {
      margin-bottom: 0;
    }
    .subtag-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 10px;
      color: var(--text-primary);
      margin-bottom: 2px;
      gap: 6px;
    }
    .subtag-count {
      color: var(--text-dim);
      font-size: 10px;
      flex-shrink: 0;
    }
    .subtag-bar {
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }
    .subtag-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
    }
    /* 一级占比行的小细条（与概览 .tag-bar 视觉同源：品牌色填充 + 半透明白色槽） */
    .l1-bar {
      display: inline-block;
      width: 54px;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
      vertical-align: middle;
      margin-left: 6px;
      flex-shrink: 0;
    }
    .l1-bar-fill {
      display: block;
      height: 100%;
      border-radius: 2px;
      background: currentColor;
      transition: width 0.6s ease;
    }
    @media (max-width: 720px) {
      .subcat-grid { grid-template-columns: 1fr 1fr; }
      .subcat-module { padding: 12px 14px; }
    }
    @media (max-width: 480px) {
      .subcat-grid { grid-template-columns: 1fr; }
    }
    .tag-stats-bar::before {
      content: '📊 题材分布';
      display: block;
      width: 100%;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 4px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .tag-stat-item {
      /* 纯展示 pill — 无 hover 效果、无 cursor pointer */
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: default;
      user-select: text;
      /* 明确去掉按钮感 */
      pointer-events: none;
    }
    .tag-stat-item .tag-name { color: var(--text); font-weight: 500; }
    .tag-stat-item .tag-count {
      background: rgba(255,255,255,0.08);
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    /* ===== Filter / Search Bar ===== */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      max-width: 360px;
      padding: 8px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: rgba(255,255,255,0.3); }
    .search-input::placeholder { color: var(--text-dim); }
    
    .filter-select {
      padding: 8px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .filter-select option { background: var(--card); }

    .filter-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }
    .filter-btn.active {
      background: rgba(255, 215, 0, 0.12);
      border-color: rgba(255, 215, 0, 0.4);
      color: var(--gold);
      font-weight: 600;
    }

    /* ===== Book List ===== */
    .book-list { display: flex; flex-direction: column; gap: 8px; }

    /* ===== 榜单分页（Top200 榜单每页 50 本）===== */
    .pagination-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin: 16px 0 4px;
    }
    .pagination-btn {
      min-width: 34px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pagination-btn:hover { border-color: rgba(255,255,255,0.25); color: var(--text); }
    .pagination-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.3);
      color: var(--text);
      font-weight: 700;
    }
    .pagination-info {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      margin: 0 0 12px;
      opacity: 0.8;
    }
    .book-item {
      display: flex;
      align-items: stretch;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: background 0.2s;
    }
    .book-item:hover { background: var(--card-hover); }

    .book-rank {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .book-rank.r1 { background: linear-gradient(135deg, #ffd700, #ffb800); color: #000; }
    .book-rank.r2 { background: linear-gradient(135deg, #c0c0c0, #a8a8a8); color: #000; }
    .book-rank.r3 { background: linear-gradient(135deg, #cd7f32, #b8722d); color: #fff; }
    .book-rank.rn { background: var(--tag-bg); color: var(--text-dim); }

    .book-info { flex: 1; min-width: 0; display: flex; gap: 16px; align-items: flex-start; }
    .book-left { flex-shrink: 0; min-width: 180px; max-width: 280px; }
    .book-name {
      font-size: 15px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .book-name a {
      color: var(--text);
      text-decoration: none;
    }
    .book-name a:hover { text-decoration: underline; }
    .book-meta {
      display: flex;
      align-items: center;
      column-gap: 8px;
      row-gap: 2px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-dim);
      flex-wrap: wrap;
    }
    .book-meta .sep { color: rgba(255,255,255,0.15); }
    .book-tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .book-tag {
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 4px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--text-dim);
      cursor: default;
    }
    .book-tag.primary {
      background: rgba(102, 126, 234, 0.15);
      border-color: rgba(102, 126, 234, 0.3);
      color: #8b9cf7;
      font-weight: 500;
    }

    .book-abstract {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.6;
      flex: 1;
      min-width: 0;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-top: 2px;
      border-left: 1px solid rgba(255,255,255,0.06);
      padding-left: 16px;
    }

    /* ===== 晋江积分榜Top1000 · 单行横向布局（方案A）===== */
    .score-item { align-items: center; padding: 10px 16px; }
    .score-item .score-name { flex-shrink: 0; width: 210px; min-width: 210px; }
    .score-item .book-meta { margin-top: 3px; }
    .score-item .score-tags {
      flex-shrink: 0; width: 320px;
      display: flex; flex-wrap: wrap; gap: 4px;
      align-content: center;
      max-height: 46px; overflow: hidden;
    }
    .score-item .score-abs {
      flex: 1; min-width: 0;
      font-size: 12px; color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 0 8px;
    }
    .score-item .score-num { flex-shrink: 0; width: 78px; text-align: right; line-height: 1.25; }
    .score-item .score-val { color: #ffd700; font-weight: 700; font-size: 14px; display: block; }
    .score-item .score-lbl { font-size: 10px; color: var(--text-dim); }
    @media (max-width: 768px) {
      .score-item { flex-wrap: wrap; align-items: flex-start; }
      .score-item .score-name { width: 100%; min-width: 0; }
      .score-item .score-tags { width: 100%; max-height: none; }
      .score-item .score-abs { white-space: normal; padding: 0; }
      .score-item .score-num { width: auto; text-align: left; }
    }

    .book-change {
      flex-shrink: 0;
      min-width: 54px;
      text-align: center;
      align-self: center;
      line-height: 1.1;
    }
    .book-change .change-num {
      font-size: 16px;
      font-weight: 700;
      display: block;
    }
    .book-change .change-label {
      font-size: 10px;
      color: var(--text-dim);
      display: block;
      margin-top: 1px;
    }
    .book-change.up .change-num { color: var(--green); }
    .book-change.down .change-num { color: var(--red); }
    .book-change.same .change-num { color: var(--text-dim); }
    .book-change.new {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      padding-top: 4px;
    }

    /* 上榜天数列 */
    .book-days {
      flex-shrink: 0;
      min-width: 48px;
      text-align: center;
      align-self: center;
      line-height: 1.1;
    }
    .book-days .days-num {
      font-size: 16px;
      font-weight: 700;
      color: #ffa94d;
      display: block;
    }
    .book-days .days-label {
      font-size: 10px;
      color: var(--text-dim);
      display: block;
      margin-top: 1px;
    }

    /* 排序按钮 active 态 */
    .filter-btn.sort-active {
      background: rgba(255,169,77,0.18);
      color: #ffa94d;
      border-color: rgba(255,169,77,0.4);
    }

    /* ===== History Date Picker ===== */
    .history-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .history-bar label {
      font-size: 13px;
      color: var(--text-dim);
    }

    /* ===== Responsive ===== */
    @media (max-width: 1200px) {
      .dash-grid, .tag-distribution, .summary-items, .new-entries-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 900px) {
      .dash-grid, .tag-distribution, .summary-items, .new-entries-grid { grid-template-columns: 1fr; }
      .tab-nav { flex-wrap: wrap; }
      .filter-bar { flex-direction: column; }
      .search-input { max-width: 100%; }
    }
    @media (max-width: 600px) {
      .main { padding: 12px; }
      .header-inner { padding: 0 12px; }
      .book-item { flex-wrap: wrap; }
      .book-info { flex-direction: column; }
      .book-left { max-width: 100%; }
      .book-abstract { border-left: none; padding-left: 0; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 8px; margin-top: 6px; -webkit-line-clamp: 2; }
      .insight-cards { grid-template-columns: 1fr; }
      .new-entry-list { grid-template-columns: 1fr; }
    }

    /* ===== Sub-Tab Navigation (起点子榜切换) ===== */
    .sub-tab-nav {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 3px;
      width: fit-content;
    }
    .sub-tab-btn {
      padding: 6px 16px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .sub-tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .sub-tab-btn.active {
      color: #fff;
      background: var(--accent-qidian);
      font-weight: 600;
    }
    #jjwxcContent .sub-tab-btn.active { background: var(--accent-jjwxc); }
    #fanqieContent .sub-tab-btn.active { background: var(--accent-fanqie); }
    .sub-tab-content { display: none; }
    .sub-tab-content.active { display: block; }

    /* ===== Loading ===== */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    .loading .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-fanqie);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
      font-size: 14px;
    }

    /* ===== Trend Chart Area ===== */
    .trend-section {
      margin-bottom: 24px;
    }
    .trend-section h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .trend-chart-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      min-height: 300px;
      position: relative;
    }
    .trend-chart-placeholder {
      text-align: center;
      padding: 40px;
      color: var(--text-dim);
      font-size: 13px;
    }

    /* Simple SVG chart styles */
    .chart-svg {
      width: 100%;
      height: 280px;
    }
    .chart-svg text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      justify-content: center;
    }
    .chart-legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: default;
    }
    .chart-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* ==========================================================
       GLASS THEME — 毛玻璃清新版（主题覆盖层 · 样张 2026-09-06）
       仅视觉覆盖：不改 DOM 结构与数据逻辑；删除本段即回滚深色原版
       版本锚点 v2：本段受 deploy.yml Frontend guard 保护，勿整体删除
       ========================================================== */
    :root {
      --bg: #eef2f9;
      --card: rgba(255,255,255,0.34);
      --card-hover: rgba(255,255,255,0.50);
      --border: rgba(255,255,255,0.55);
      --text: #232946;
      --text-dim: #4d5464;
      --tag-bg: rgba(35,41,70,0.05);
      --tag-border: rgba(35,41,70,0.09);
      --green: #1f9d55;
      --red: #e03131;
      --gold: #d9a400;
      --glass-blur: blur(26px) saturate(170%);
      --glass-shadow: 0 8px 32px rgba(60,72,120,0.14);
    }

    /* 弥散风横版背景：固定全屏背景层（fixed 伪元素，确保覆盖整个网页到底） */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(rgba(255,255,255,0.30), rgba(255,255,255,0.20)),
        url("assets/bg-diffused-wide.jpg") center / cover no-repeat,
        #f2f0ec;
    }

    /* Header 玻璃条 */
    .header {
      background: rgba(255,255,255,0.38);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 16px rgba(60,72,120,0.06);
    }
    .header h1 {
      background: linear-gradient(135deg, #e8601c, #d63384, #b0301e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Tab 导航玻璃 pill */
    .tab-nav {
      background: rgba(255,255,255,0.30);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
    }
    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.6); }
    .tab-btn.active { color: #fff; box-shadow: 0 4px 14px rgba(60,72,120,0.18); }

    /* 全部卡片/容器统一玻璃化 */
    .dash-card, .insight-card, .tag-dist-card, .new-entries-column,
    .platform-summary, .tag-stats-bar, .trend-chart-container,
    .book-item, .search-input, .filter-select, .filter-btn,
    #aiOverallSection > div, #crossPlatformSection > div {
      background: var(--card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
      box-shadow: var(--glass-shadow);
    }
    .book-item:hover { background: var(--card-hover); }
    .search-input:focus {
      border-color: rgba(99,102,241,0.5);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .filter-select option { background: #f6f8fd; color: var(--text); }
    .filter-btn:hover { border-color: rgba(35,41,70,0.2); color: var(--text); }
    .filter-btn.active {
      background: rgba(217,164,0,0.12);
      border-color: rgba(217,164,0,0.45);
      color: #a87900;
    }
    .filter-btn.sort-active {
      background: rgba(234,132,12,0.12);
      border-color: rgba(234,132,12,0.4);
      color: #d97706;
    }

    /* 子榜切换 pill */
    .sub-tab-nav {
      background: rgba(255,255,255,0.45);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border);
    }
    .sub-tab-btn:hover { background: rgba(255,255,255,0.6); color: var(--text); }

    /* 浅色下的分隔线与底衬 */
    .dash-top-list li, .new-entry-item { border-bottom-color: rgba(35,41,70,0.06); }
    .tag-bar { background: rgba(35,41,70,0.07); }
    .summary-item { background: rgba(255,255,255,0.5); }
    .book-abstract { border-left-color: rgba(35,41,70,0.08); }
    .book-meta .sep { color: rgba(35,41,70,0.25); }
    .dash-rank.rn, .book-rank.rn { background: rgba(35,41,70,0.07); }
    .tag-stat-item .tag-count { background: rgba(35,41,70,0.07); }

    /* 浅底下文字可读性修正（深底亮色 → 深色系语义色） */
    .book-tag.primary {
      background: rgba(79,70,229,0.08);
      border-color: rgba(79,70,229,0.25);
      color: #4f46e5;
    }
    .book-days .days-num { color: #ea7d0c; }
    .score-item .score-val { color: #c99700; }
    .book-change.new { color: #a87900; }
    .chart-svg text { fill: #5c6372; }
    .loading .spinner { border-color: rgba(35,41,70,0.12); border-top-color: var(--accent-fanqie); }

    /* 数字等宽对齐 */
    .insight-card-value, .change-num, .days-num, .score-val, .dash-rank, .book-rank {
      font-variant-numeric: tabular-nums;
    }

    /* ===== v2 调整（sherry 反馈 2026-09-06）===== */
    /* 1) 拿掉模块卡片的彩色装饰条 */
    .dash-card::before, .new-entries-column::before { display: none; }
    .summary-item { border-left: none; }

    /* 2) 选中 Tab 改为磨砂玻璃按钮（不再实色填充） */
    .tab-btn.active, .tab-btn.active[data-tab],
    .sub-tab-btn.active, #jjwxcContent .sub-tab-btn.active, #fanqieContent .sub-tab-btn.active {
      background: rgba(255,255,255,0.55) !important;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      color: var(--text) !important;
      border: 1px solid rgba(255,255,255,0.75);
      box-shadow: 0 4px 16px rgba(60,72,120,0.15), inset 0 1px 0 rgba(255,255,255,0.65);
      font-weight: 600;
    }

    /* 4) 题材占比条磨砂化（概览题材分布 = 各平台细分题材的统一标准，sherry 2026-09-07） */
    .tag-bar-fill { opacity: 0.5; }
    .subcat-module .subtag-bar-fill,
    .subcat-module .l1-bar-fill { opacity: 0.5; }

    /* 5) 字体：MiSans 全局（清新圆润几何，匹配弥散玻璃风） */
    body {
      font-family: 'MiSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    /* 5b) 标题用霞鹜文楷（文学气质，贴小说主题） */
    .header h1, .platform-title, .insight-section h3, .new-entries h3,
    .platform-summary h3, .trend-section h3, .dash-card-title {
      font-family: 'LXGW WenKai', 'MiSans', 'PingFang SC', serif;
    }

    /* 6) 概览平台区版式（现 4 平台并列：晋江/长佩/番茄/七猫）
       原 CSS ≤1200px 塌 2 列；3 平台时期 881px+ 恒 3 列。
       现 4 平台：>1200px 整行 4 列；881–1200px 2×2 整齐排布
       （杜绝 3+1 / 2+1 孤卡）；≤880px 交给原 CSS 单列/堆叠。 */
    @media (min-width: 1201px) {
      .dash-grid, .tag-distribution, .summary-items, .new-entries-grid {
        grid-template-columns: repeat(4, 1fr) !important;
      }
    }
    @media (min-width: 881px) and (max-width: 1200px) {
      .dash-grid, .tag-distribution, .summary-items, .new-entries-grid {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }

    /* 7) 平台页榜单卡 · 竖分割线贯穿每张卡顶到底
       原 .book-info { align-items: flex-start } → 简介高度随文字行数变化，
       border-left 竖线跟着短长不一、左侧标签行数差又让整卡高度参差，整体看着乱。
       改为 stretch 后 .book-abstract 与 .book-left 同高，竖线满高贯穿每张卡，
       跨卡看也只在各自卡内完整统一，不破坏列表节奏。 */
    .book-item .book-info { align-items: stretch; }

    /* 8) 书卡格式完全一致：简介完整展开不省略 + 卡内容顶部对齐（等高由 JS 对齐统一，见脚本尾部） */
    .book-item .book-abstract {
      -webkit-line-clamp: unset;      /* 取消 3 行截断，简介完整显示 */
      overflow: visible;
      text-overflow: clip;
      align-self: stretch;            /* 撑满整行高 → 竖线满高 */
      display: flex;
      flex-direction: column;
      justify-content: flex-start;    /* 内容顶部对齐：等高后所有卡标题/简介起点跨卡一致，留白统一落底部 */
    }

    /* 9) 竖分割线跨卡同一 x 对齐：左列（书名+作者+标签）固定统一宽度，
       简介 border-left 竖线钉在同一竖直线上，不再随标签数量漂移 */
    @media (min-width: 601px) {
      .book-item .book-left {
        width: 240px;
        min-width: 240px;
        max-width: 240px;
        flex: none;
      }
    }

    /* 10) 长佩总榜 · 今日流行总结（整行横幅置顶，替代爆款新书） */
    .summary-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
      backdrop-filter: blur(18px) saturate(1.5);
      -webkit-backdrop-filter: blur(18px) saturate(1.5);
    }
    .summary-banner-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }
    .summary-banner-title {
      font-family: 'LXGW WenKai', 'MiSans', 'PingFang SC', serif;
      font-size: 14px;
      font-weight: 700;
    }
    .summary-banner-date {
      font-size: 12px;
      color: var(--text-dim);
    }
    .summary-banner-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
    }
    /* 三 block 之间竖分割线，形成三个独立分区（同在一个 banner 内） */
    .summary-block {
      padding-right: 16px;
    }
    .summary-block + .summary-block {
      padding-left: 16px;
      border-left: 1px solid var(--border);
    }
    .summary-block-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .summary-line {
      font-size: 12px;
      line-height: 1.7;
      color: var(--text);
      padding: 2px 0;
      border-bottom: 1px dashed var(--border);
    }
    .summary-line:last-child { border-bottom: none; }
    @media (max-width: 880px) {
      .summary-banner-grid { grid-template-columns: 1fr; }
      .summary-block { padding-right: 0; }
      .summary-block + .summary-block {
        padding-left: 0;
        border-left: none;
        border-top: 1px solid var(--border);
        padding-top: 10px;
        margin-top: 6px;
      }
    }

    /* 11) 长佩总榜 · 题材分布百分比条卡（概览页同款 tag-bar 视觉） */
    .dist-card-sub {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .insight-card .tag-bar-container {
      margin-bottom: 7px;
    }
    .insight-card .tag-bar-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 3px;
    }
    .insight-card .tag-bar-label span:first-child { color: var(--text); }
    .insight-card .tag-bar-label span:last-child { color: var(--text-dim); }
    .insight-card .tag-bar {
      height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .insight-card .tag-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s ease;
      opacity: 0.55;
    }

    /* 12) Header 吸顶窄高导航栏（2026-09-07 sherry 要求：缩高、只留 标题+tab、
       更新时间右下角贴底不占高、整体作为 navigation bar） */
    .header { padding: 7px 0; }
    .header-inner {
      display: flex;
      align-items: center;

<script>
// ========== 全局状态 ==========
const state = {
  data: {},        // { fanqie, jjwxc, changpei }
  history: {},     // { fanqie: { index, data }, ... }
  analysis: null,  // AI 分析结果
  loaded: {},
};

const PLATFORMS = [
  { id: 'jjwxc', name: '晋江文学城', icon: '🌸', color: '#e6488a', source: '月榜 Top200' },
  { id: 'changpei', name: '长佩文学', icon: '💜', color: '#6c5ce7', source: '畅销榜 Top200' },
  { id: 'fanqie', name: '番茄小说', icon: '🍅', color: '#ff6b35', source: '女频最热榜 Top200' },
  { id: 'qimao', name: '七猫小说', icon: '🐱', color: '#ff9500', source: '女频大热榜 Top20' },
];

const CHART_COLORS = [
  '#667eea', '#e6488a', '#ff6b35', '#2ecc71', '#ffd700',
  '#9b59b6', '#3498db', '#e74c3c', '#1abc9c', '#f39c12',
  '#8e44ad', '#2980b9', '#d35400', '#27ae60', '#c0392b',
];

// ========== 数据加载 ==========
/* ========== 标签归一化：界面统一显示「耽美」（数据里晋江/长佩原词为「纯爱」） ========== */
const TAG_TERM_MAP = { '纯爱': '耽美' };
function normTag(t) { return TAG_TERM_MAP[t] || t; }
function mergeStats(stats) {
  const out = {};
  for (const [k, v] of Object.entries(stats)) {
    const nk = normTag(k);
    out[nk] = (out[nk] || 0) + v;
  }
  return out;
}
function normalizeTags(o) {
  if (!o || typeof o !== 'object') return o;
  if (Array.isArray(o.books)) {
    o.books.forEach(b => {
      if (!b || typeof b !== 'object') return;
      if (b.primary_tag) b.primary_tag = normTag(b.primary_tag);
      if (Array.isArray(b.all_tags)) b.all_tags = b.all_tags.map(normTag);
      if (b.channel) b.channel = normTag(b.channel);
      if (b.gender) b.gender = normTag(b.gender);
    });
  }
  Object.keys(o).forEach(k => {
    const v = o[k];
    if (v && typeof v === 'object' && !Array.isArray(v) && /(tag_stats|gender_stats|stats)$/.test(k)) {
      o[k] = mergeStats(v);
    }
  });
  return o;
}
/* AI 文案兜底替换（仅用于展示层，不改原始 JSON） */
function cx(s) { return (s || '').replace(/纯爱/g, '耽美'); }

async function loadJSON(path) {
  try {
    const res = await fetch(path);
    if (!res.ok) return null;
    return normalizeTags(await res.json());
  } catch { return null; }
}

// ===== 七猫数据适配：爬虫只产女生日榜 girl_hot.json（Top20，--girl），
// 无 latest.json。此处直接使用女频榜单数据（rank 保持 1-20，gender 统一补标"女频"），
// 使下游渲染（概览卡/题材分布/新上榜/平台页列表与筛选）全部通用生效。=====
async function loadQimaoData() {
  const girl = await loadJSON('data/qimao/girl_hot.json');
  if (!girl?.books) return null;

  const tag = (b) => ({ ...b, gender: '女频', channel: b.channel || b.primary_tag || '' });
  const all = girl.books.map((b, i) => tag({ ...b, rank: i + 1 }));

  return {
    books: all,
    total_count: all.length,
    tag_stats: girl.tag_stats || {},
    status_stats: girl.status_stats || {},
    gender_stats: { 女频: all.length },
    platform: girl.platform, platform_name: girl.platform_name,
    source: girl.source, source_url: girl.source_url,
    update_date: girl.update_date, update_time: girl.update_time,
  };
}

async function loadAllData() {
  const promises = PLATFORMS.map(p => p.id === 'qimao'
    ? loadQimaoData()
    : loadJSON(`data/${p.id}/latest.json`));
  const results = await Promise.all(promises);
  
  PLATFORMS.forEach((p, i) => {
    state.data[p.id] = results[i];
  });
  
  // 也尝试加载历史索引
  for (const p of PLATFORMS) {
    try {
      const idx = await loadJSON(`data/${p.id}/history_index.json`);
      state.history[p.id] = { index: idx || [] };
    } catch { state.history[p.id] = { index: [] }; }
  }

  // 月度榜单的月份索引（起点收藏榜 / 晋江积分榜Top1000）
  try {
    const ci = await loadJSON('data/qidian/collection_index.json');
    state.history.qidian_collection = { index: ci || [] };
  } catch { state.history.qidian_collection = { index: [] }; }
  try {
    const si = await loadJSON('data/jjwxc/score1000_index.json');
    state.history.jjwxc_score = { index: si || [] };
  } catch { state.history.jjwxc_score = { index: [] }; }
  try {
    const pi = await loadJSON('data/fanqie/peak_index.json');
    state.history.fanqie_peak = { index: pi || [] };
  } catch { state.history.fanqie_peak = { index: [] }; }

  // 加载 AI 分析结果
  state.analysis = await loadJSON('data/analysis.json');
}

// ========== Tab 切换 ==========
function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tabId}`).classList.add('active');
  document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');

  if (tabId === 'dashboard') {
    renderDashboard();
  } else {
    renderPlatformTab(tabId);
  }
}

// ========== Dashboard 渲染 ==========
function renderDashboard() {
  const hasAnyData = Object.values(state.data).some(d => d?.books?.length > 0);
  if (!hasAnyData) {
    document.getElementById('dashLoading').innerHTML = '<div class="empty-state">暂无数据，请先运行爬虫脚本获取数据</div>';
    return;
  }

  document.getElementById('dashLoading').style.display = 'none';
  document.getElementById('dashContent').style.display = 'block';

  renderInsightCards();
  renderDashTopGrid();
  renderTagDistribution();
  renderNewEntries();
  renderPlatformSummary();
  renderTrendChart();
  updateUpdateInfo();
  requestAnimationFrame(equalizeOverviewCards);
}

/* ========== 概览楼层内卡片等高 + 超高卡内滚动（v3, 2026-09-09）==========
   每层 4 张平台卡彼此等高：以该层内容最多的卡为准，但设上限 cap——
   超出 cap 的层整体截到 cap，内容在卡内滚动；没超则 4 卡等高于自然最高卡。
   窄屏单列时不做等高（每卡自适应自然高度）。 */
function equalizeOverviewCards() {
  const isNarrow = window.matchMedia('(max-width: 880px)').matches;
  const LAYERS = [
    { id: 'dashTopGrid',      cardSel: '.dash-card',           cap: 480 },
    { id: 'tagDistribution',  cardSel: '.tag-dist-card',       cap: 520 },
    { id: 'summaryItems',     cardSel: '.summary-item',        cap: 400 },  // 各站内容特点：AI 四维总结信息量大，锁半屏内（卡 400 + 标题≈40 ≤ ~470 @1080p），超出卡内滚动
    { id: 'newEntryGrid',     cardSel: '.new-entries-column',  cap: 560 },
  ];
  LAYERS.forEach(L => {
    const box = document.getElementById(L.id);
    if (!box) return;
    const cards = [...box.querySelectorAll(':scope > ' + L.cardSel)];
    if (cards.length === 0) return;
    // 先复位高度再测自然高度
    cards.forEach(c => c.style.height = 'auto');
    if (isNarrow) return; // 窄屏单列：自适应即可
    const natural = Math.max(...cards.map(c => c.scrollHeight || 0));
    const h = Math.min(natural, L.cap);
    cards.forEach(c => c.style.height = h + 'px');
  });
}

/* ========== 题材分布 · final 一级池（sherry 2026-09-09）==========
   一级池词表来自飞书《novel-tracker 分类池》06-09 表：
   晋江 = channel 频道词(6)；长佩 = 频道词 tags[0](15)；
   番茄 = 官方主分类一级(23，all_tags 命中)；七猫 = major(3)。
   池外命中不到的书归入「其他」。 */
const L1_POOLS = {
  jjwxc:   { field: 'channel',    words: ['纯爱','言情','无CP','百合','多元','未知'] },
  changpei:{ field: 'primary_tag',words: ['都市','综合','架空','青春','宫廷','奇幻','推理','现代','玄幻','科幻','武侠','灵异','民国','脑洞','小说'] },
  fanqie:  { field: 'all_tags',   words: ['古风世情','科幻末世','游戏体育','女频衍生','玄幻言情','种田','年代','现言脑洞','宫斗宅斗','悬疑脑洞','古言脑洞','快穿','青春甜宠','星光璀璨','女频悬疑','职场婚恋','豪门总裁','民国言情','双男主','无CP','双女主','纯爱','男频衍生'] },
  qimao:   { field: 'channel',    words: ['现代言情','古代言情','幻想言情'] },
};

// 返回书的一级池词；匹配不到返回 null（调用方归「其他」）
function bookL1(platformId, b) {
  const def = L1_POOLS[platformId];
  if (!def || !b) return null;
  if (def.field === 'all_tags') {
    const tags = b.all_tags || [];
    for (const t of tags) if (def.words.includes(t)) return t;
    return null;
  }
  const v = b[def.field];
  return (v && def.words.includes(v)) ? v : null;
}

    // 按 final 一级池统计（池外归「其他」）
    const cnt = { __other: 0 };
    books.forEach(b => {

      if (l1) cnt[l1] = (cnt[l1] || 0) + 1;

    const total = books.length;
    const entries = Object.entries(cnt).filter(([, n]) => n > 0)

      .map(([tag, n]) => tag === '__other' ? ['其他', n] : [normTag(tag), n]);

// ========== 智能分析引擎 ==========
// 基于数据特征匹配的洞察生成，不依赖外部 API
function generatePlatformInsight(platformId, data) {
  const books = data.books;
  const tagStats = data.tag_stats || {};
  const genderStats = data.gender_stats || {};
  const total = books.length;
  
  const sortedTags = Object.entries(tagStats).sort((a, b) => b[1] - a[1]);
  const sortedGenders = Object.entries(genderStats).sort((a, b) => b[1] - a[1]);
  const newBooks = books.filter(b => b.rank_change === 'new');
  const risingBooks = books.filter(b => typeof b.rank_change === 'number' && b.rank_change > 0).sort((a, b) => b.rank_change - a.rank_change);
  
  const insights = [];
  
  // === 1. 频道/受众分析 ===
  if (sortedGenders.length > 0) {
    const [topGender, topCount] = sortedGenders[0];
    const topPct = Math.round(topCount / total * 100);
    
    const platformAudience = {
      fanqie: { desc: '番茄小说以免费阅读模式吸引了大量下沉市场用户', maleReason: '男性向轻阅读内容更符合碎片化消费场景', femaleReason: '女性向甜宠、爽文迎合了年轻女性快消需求' },
      qidian: { desc: '起点作为付费网文龙头平台，用户粘性高、付费意愿强', maleReason: '男频是起点的传统强势领域，长期积累了大量硬核书迷', femaleReason: '起点女频近年发力明显，持续争夺市场份额' },
      jjwxc: { desc: '晋江以原创女性向内容为核心定位', pureaiReason: '耽美（BL）是晋江最具标志性的品类，IP改编热度高', yanqingReason: '言情仍是晋江基盘，古言/现代言情受众稳定' },
    };
    const aud = platformAudience[platformId] || {};
    
    if (topPct >= 60) {
      if (platformId === 'jjwxc') {
        const reason = topGender === '耽美' ? (aud.pureaiReason || '') : (aud.yanqingReason || '');
        insights.push(`${topGender}类作品占比${topPct}%，主导地位明显。${reason ? reason + '。' : ''}`);
      } else {
        const reason = topGender.includes('男') ? (aud.maleReason || '') : (aud.femaleReason || '');
        insights.push(`${topGender}内容占比${topPct}%，优势显著。${reason ? reason + '。' : ''}`);
      }
    } else if (sortedGenders.length >= 2) {
      insights.push(`${sortedGenders.map(([g, c]) => `${g}${Math.round(c/total*100)}%`).join('、')}，内容分布相对均衡。`);
    }
  }
  
  // === 2. 题材特色分析 ===
  if (sortedTags.length > 0) {
    const [topTag, topTagCount] = sortedTags[0];
    const topTagPct = Math.round(topTagCount / total * 100);
    
    // 题材 → 行业解读知识库
    const tagInsights = {
      '都市': '都市题材贴近生活、易于代入，在免费阅读平台尤其受欢迎',
      '玄幻': '玄幻是网文最经典的品类之一，读者基础庞大且粘性高',
      '仙侠': '仙侠是中式幻想的代表题材，在男频市场有深厚的读者根基',
      '科幻': '科幻题材正处上升期，受到影视改编和科技热潮双重利好',
      '悬疑': '悬疑推理类作品适合短平快阅读，在移动端有天然优势',
      '游戏': '游戏题材的火热反映了Z世代读者群体的娱乐偏好',
      '历史': '历史类作品往往字数较长、读者忠诚度高',
      '武侠': '武侠是经典但较小众的品类，核心粉丝忠实',
      '耽美': '耽美（BL）内容的IP改编价值极高，是影视剧热门选题',
      '言情': '言情是女性向阅读的基石品类，市场规模最大',
      '甜文': '甜宠文迎合了读者的情感慰藉需求，完读率通常很高',
      '快穿': '快穿题材节奏快、设定新颖，是近年女频的热门方向',
      '宫斗': '宫斗类作品与影视改编高度契合，有成熟的商业变现路径',
      '校园': '校园题材吸引年轻读者，也是轻体量影视改编的热门素材',
    };
    
    if (topTagPct >= 20) {
      const tagNote = tagInsights[topTag] || '';
      insights.push(`「${topTag}」题材以${topTagPct}%领跑。${tagNote ? tagNote + '。' : ''}`);
    }
    
    // 题材集中度分析
    const top3Sum = sortedTags.slice(0, 3).reduce((s, [, c]) => s + c, 0);
    const top3Pct = Math.round(top3Sum / total * 100);
    if (top3Pct >= 70) {
      insights.push(`Top3题材（${sortedTags.slice(0,3).map(([t])=>t).join('、')}）合计占${top3Pct}%，内容集中度高。`);
    } else if (top3Pct <= 45 && sortedTags.length >= 5) {
      insights.push(`题材分布较为分散（Top3仅占${top3Pct}%），说明平台内容生态多样化。`);
    }
  }
  
  // === 3. 新上榜作品分析 ===
  if (newBooks.length > 0) {
    const newTags = {};
    newBooks.forEach(b => { newTags[b.primary_tag] = (newTags[b.primary_tag] || 0) + 1; });
    const topNewTag = Object.entries(newTags).sort((a, b) => b[1] - a[1])[0];
    
    let newInsight = `今日有${newBooks.length}部新作上榜`;
    if (topNewTag && topNewTag[1] >= 2) {
      newInsight += `，其中「${topNewTag[0]}」题材最多（${topNewTag[1]}部），表明该方向近期热度正在上升`;
    } else if (newBooks.length > 0) {
      const firstNew = newBooks[0];
      newInsight += `，排名最高的是《${firstNew.book_name}》(#${firstNew.rank})，题材为「${firstNew.primary_tag || '未分类'}」`;
    }
    insights.push(newInsight + '。');
  }
  
  // === 4. 排名波动分析 ===
  if (risingBooks.length > 0) {
    const bigRiser = risingBooks[0];
    if (bigRiser.rank_change >= 5) {
      insights.push(`《${bigRiser.book_name}》上升${bigRiser.rank_change}位，势头强劲，值得关注。`);
    }
  }
  
  // === 5. 平台级总结（兜底） ===
  if (insights.length === 0) {
    insights.push('数据分析中，更多维度的洞察需要积累多天数据后呈现。');
  }
  
  return insights.join('');
}

function renderTrendChart() {
  const container = document.getElementById('trendChart');
  // 趋势图需要多天历史数据 — 收集各平台历史索引看看有没有
  const allHaveHistory = PLATFORMS.some(p => state.history[p.id]?.index?.length >= 2);
  
  if (!allHaveHistory) {
    container.innerHTML = '<div class="trend-chart-placeholder">📊 需要至少2天历史数据才能展示趋势图<br><br>每日运行爬虫后，这里会自动显示各题材在三站的热度变化折线图</div>';
    return;
  }

  // 收集近7天数据
  loadTrendData().then(trendData => {
    if (!trendData || Object.keys(trendData).length === 0) {
      container.innerHTML = '<div class="trend-chart-placeholder">暂无足够的趋势数据</div>';
      return;
    }
    drawTrendChart(container, trendData);
  });
}

async function loadTrendData() {
  const trendData = {}; // { date: { platform: { tag: count } } }
  
  for (const p of PLATFORMS) {
    const idx = state.history[p.id]?.index || [];
    const recent = idx.slice(0, 7); // 最近7天
    
    for (const date of recent) {
      const data = await loadJSON(`data/${p.id}/history/${date}.json`);
      if (data?.tag_stats) {
        if (!trendData[date]) trendData[date] = {};
        trendData[date][p.id] = data.tag_stats;
      }
    }
  }
  
  return trendData;
}

function drawTrendChart(container, trendData) {
  const dates = Object.keys(trendData).sort();
  if (dates.length < 2) {
    container.innerHTML = '<div class="trend-chart-placeholder">需要更多历史数据</div>';
    return;
  }
  
  // 找出所有平台中出现最多的题材 top5
  const tagTotals = {};
  for (const date of dates) {
    for (const pid of Object.keys(trendData[date] || {})) {
      for (const [tag, count] of Object.entries(trendData[date][pid])) {
        tagTotals[tag] = (tagTotals[tag] || 0) + count;
      }
    }
  }
  const topTags = Object.entries(tagTotals).sort((a, b) => b[1] - a[1]).slice(0, 8).map(e => e[0]);
  
  // 构建各平台各题材的时间序列
  const series = [];
  let colorIdx = 0;
  for (const p of PLATFORMS) {
    for (const tag of topTags.slice(0, 3)) { // 每平台取top3题材
      const values = dates.map(d => trendData[d]?.[p.id]?.[tag] || 0);
      if (values.some(v => v > 0)) {
        series.push({ label: `${p.name}-${tag}`, values, color: CHART_COLORS[colorIdx % CHART_COLORS.length] });
        colorIdx++;
      }
    }
  }

  // SVG 绘制
  const W = 900, H = 260, pad = { t: 20, r: 20, b: 40, l: 45 };
  const chartW = W - pad.l - pad.r;
  const chartH = H - pad.t - pad.b;
  
  const maxVal = Math.max(...series.flatMap(s => s.values), 1);
  const xStep = dates.length > 1 ? chartW / (dates.length - 1) : chartW;

  let svgContent = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  
  // 网格线
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + (chartH / 4) * i;
    const val = Math.round(maxVal * (1 - i / 4));
    svgContent += `<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
    svgContent += `<text x="${pad.l-8}" y="${y+4}" text-anchor="end" fill="#8b8fa3" font-size="10">${val}</text>`;
  }
  
  // X 轴日期标签
  dates.forEach((d, i) => {
    const x = pad.l + i * xStep;
    svgContent += `<text x="${x}" y="${H-10}" text-anchor="middle" fill="#8b8fa3" font-size="10">${d.slice(5)}</text>`;
  });

  // 折线
  for (const s of series) {
    const points = s.values.map((v, i) => {
      const x = pad.l + i * xStep;
      const y = pad.t + chartH - (v / maxVal) * chartH;
      return `${x},${y}`;
    }).join(' ');
    svgContent += `<polyline points="${points}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    // 数据点
    s.values.forEach((v, i) => {
      const x = pad.l + i * xStep;
      const y = pad.t + chartH - (v / maxVal) * chartH;
      svgContent += `<circle cx="${x}" cy="${y}" r="3" fill="${s.color}"/>`;
    });
  }

  svgContent += '</svg>';

  // 图例
  const legendHtml = series.map(s => `
    <span class="chart-legend-item">
      <span class="chart-legend-dot" style="background:${s.color}"></span>
      ${s.label}
    </span>
  `).join('');

  container.innerHTML = svgContent + `<div class="chart-legend">${legendHtml}</div>`;
}

  const blocks = (summaryData?.blocks || []).filter(b => b?.title && b?.lines?.length);
  const head = `<div class="summary-banner-head">
      <span class="summary-banner-title">📝 今日流行总结</span>
      ${summaryData?.date ? `<span class="summary-banner-date">${summaryData.date}</span>` : ''}

// ========== 细分题材 — 4 平台统一两级模块 ==========
// 一级：大题材/频道（晋江 channel / 长佩 tags[0] / 番茄 primary_tag / 七猫 channel）
// 二级：该一级下细分 tag（取自 books.tags / all_tags，按平台规则剥离一级本身与通用项）
// 同义 tag 通过 SUBTAG_NORMALIZE 词典归一（长佩 CP/人设型归并为主；其他平台原样保留）
const SUBTAG_NORMALIZE = {
  // 长佩 — CP / 人设
  '年上养成': '年上', '其他年上': '年上', '年上': '年上',
  '年下攻': '年下', '年下': '年下',
  '双强': '强强', '强强联手': '强强',
  '1v1': 'HE', '1V1': 'HE', 'Happy Ending': 'HE', 'happy ending': 'HE', 'HE': 'HE',
  'BE': 'BE', '悲剧': 'BE', '虐文': 'BE',
  '甜文': '甜宠', '小甜文': '甜宠', '甜': '甜宠',
  '狗血': '狗血', '虐恋': '狗血', '虐恋情深': '狗血',
  '暗恋': '暗恋', '单箭头': '暗恋',
  '现代': '都市', '近代现代': '都市',
  '古风': '架空', '古代': '架空',
  // 长佩 — 标签统一（与 cx() 等价）
  '纯爱': '耽美'
};

function normalizeChip(chip, platformId) {
  if (!chip) return '';
  const t = String(chip).trim();
  // 长佩应用归一化词典 + 全平台「纯爱」→「耽美」
  if (platformId === 'changpei' && SUBTAG_NORMALIZE[t]) return SUBTAG_NORMALIZE[t];
  if (t === '纯爱') return '耽美';
  return t;
}

function getPrimaryTag(book, platformId) {
  if (platformId === 'jjwxc') return book.channel || '';
  if (platformId === 'changpei') return (book.tags && book.tags[0]) || '';
  if (platformId === 'fanqie') return book.primary_tag || '';
  if (platformId === 'qimao') return book.channel || '';
  return '';
}

function getSubTags(book, platformId) {
  const all = book.all_tags || book.tags || [];
  if (!Array.isArray(all)) return [];
  let tags = all.slice();
  if (platformId === 'jjwxc') {
    // 晋江 chips：[原创, 频道, 细分1, 细分2, ...] — 跳过前 2 项
    tags = tags.slice(2);
  } else if (platformId === 'changpei') {
    // 长佩：[大题材, CP/风格, 设定, ...] — 跳过 tags[0]
    tags = tags.slice(1);
  } else if (platformId === 'fanqie') {
    // 番茄：去掉与 primary_tag 重叠项 + 通用占位（女频/原创）
    const primary = book.primary_tag || '';
    tags = tags.filter(x => x && x !== primary && x !== '女频' && x !== '原创' && x !== '现代言情');
  } else if (platformId === 'qimao') {
    const ch = book.channel || '';
    tags = tags.filter(x => x && x !== ch);
  }
  return tags.filter(Boolean);
}

// 细分品类模块（两级：横向一级 chip + 每 chip 内嵌二级细分条形图）
function subCategoryHTML(books, platformId, opts = {}) {
  const {
    color = '#888',
    maxL1 = 8,
    maxL2 = 4,
    label = '细分题材',
    showHeader = true
  } = opts;
  if (!Array.isArray(books) || !books.length) return '';

  // 1) 聚合 一级 → 二级
  const l1Map = {};   // { l1: { total, l2Map } }
  const l1Order = [];
  for (const b of books) {
    const l1Raw = getPrimaryTag(b, platformId);
    if (!l1Raw) continue;
    const l1 = platformId === 'changpei' ? cx(l1Raw) : cx(l1Raw);
    if (!l1Map[l1]) { l1Map[l1] = { total: 0, l2Map: {} }; l1Order.push(l1); }
    l1Map[l1].total += 1;
    const l2List = getSubTags(b, platformId);
    for (const raw of l2List) {
      const t = normalizeChip(raw, platformId);
      if (!t) continue;
      l1Map[l1].l2Map[t] = (l1Map[l1].l2Map[t] || 0) + 1;
    }
  }

  if (!l1Order.length) return '';

  // 2) 一级按 total 降序，取 Top N；占比分母 = 全榜（所有带一级题材的书），非仅 TopN
  l1Order.sort((a, b) => l1Map[b].total - l1Map[a].total);
  const topL1 = l1Order.slice(0, maxL1);
  const fullTotal = l1Order.reduce((s, k) => s + l1Map[k].total, 0);

  // 3) 渲染卡片网格
  const cards = topL1.map(l1 => {
    const { total, l2Map } = l1Map[l1];
    const l2Entries = Object.entries(l2Map)
      .sort((a, b) => b[1] - a[1])
      .slice(0, maxL2);
    const l2HTML = l2Entries.length
      ? l2Entries.map(([tag, count]) => {
          const pct = total > 0 ? Math.round(count / total * 100) : 0;
          return `<div class="subtag-row">
            <div class="subtag-label">
              <span>${cx(tag)}</span>
              <span class="subtag-count">${count} · ${pct}%</span>
            </div>
            <div class="subtag-bar"><div class="subtag-bar-fill" style="width:${pct}%;background:${color};"></div></div>
          </div>`;
        }).join('')
      : '<div style="font-size:10px;color:var(--text-dim);padding:4px 0;">暂无细分 tag</div>';
    const overallPct = fullTotal > 0 ? Math.round(total / fullTotal * 100) : 0;
    return `<div class="subcat-card">
        <div class="subcat-head">
          <span class="subcat-title" style="color:${color};">${cx(l1)}</span>
          <span class="subcat-total">${total} 本 · ${overallPct}%</span>
        </div>
        ${l2HTML}
      </div>`;
  }).join('');

  // 3.5) 一级题材占比总览（细分类上方）— 例：都市 52% · 架空 20% · 综合 16%
  const l1DistHTML = showHeader && topL1.length > 0
    ? `<div class="l1-dist">
        <span class="l1-dist-title">一级题材占比</span>
        ${topL1.map(l1 => {
          const pct = fullTotal > 0 ? Math.round(l1Map[l1].total / fullTotal * 100) : 0;
          return `<span class="l1-dist-item" style="color:${color};"><b>${cx(l1)}</b><span class="l1-dist-pct">${pct}%</span><span class="l1-bar"><span class="l1-bar-fill" style="width:${pct}%;background:${color};"></span></span></span>`;
        }).join('<span class="l1-dist-sep">·</span>')}
      </div>`
    : '';

  const headerHTML = showHeader
    ? `<div class="subcat-head-row">
        <h3 class="subcat-module-title">📊 ${label}</h3>
        <span class="subcat-module-meta">Top ${topL1.length} 题材 · 每级 ${maxL2} 细分</span>
      </div>`
    : '';

  return `<div class="subcat-module">${headerHTML}${l1DistHTML}<div class="subcat-grid">${cards}</div></div>`;
}

  const genderStats = data.gender_stats || {};

  const coverageDays = (state.history[platformId]?.index?.length) || 0;

       </div>`

        ${Object.entries(tagStats).sort((a,b) => b[1] - a[1]).map(([tag, count]) => `
          <span class="tag-stat-item">
            <span class="tag-name">${tag}</span>
            <span class="tag-count">${count}</span>
          </span>

      <div>
        <div class="platform-title">${platform.icon} ${platform.name} — ${platform.source}</div>
        <div class="platform-meta">更新时间: ${data.update_time || '未知'} | 来源: <a href="${data.source_url}" target="_blank" style="color:${platform.color};">${data.source}</a>${coverageDays > 0 ? ` · <span style="color:#ffa94d;">📅 已统计 ${coverageDays} 天数据</span>` : ''}</div>
      </div>
    </div>

    ${topBlockHTML}

    <!-- 筛选工具栏 -->
    <div class="filter-bar">
      <input class="search-input" type="text" placeholder="搜索书名或作者..." id="search-${platformId}" oninput="filterBooks('${platformId}')">
      <button class="filter-btn" id="newonly-${platformId}" onclick="toggleNewOnly('${platformId}')">🆕 新上榜</button>

function renderBookList(books, platformId) {
  return books.map(b => {
    const rankClass = b.rank <= 3 ? `r${b.rank}` : 'rn';
    let changeHtml = '';
    if (b.rank_change === 'new') {
      changeHtml = '<span class="book-change new">NEW</span>';
    } else if (typeof b.rank_change === 'number') {
      if (b.rank_change > 0) changeHtml = `<span class="book-change up"><span class="change-num">↑${b.rank_change}</span><span class="change-label">昨日</span></span>`;
      else if (b.rank_change < 0) changeHtml = `<span class="book-change down"><span class="change-num">↓${Math.abs(b.rank_change)}</span><span class="change-label">昨日</span></span>`;
      else changeHtml = '<span class="book-change same"><span class="change-num">—</span><span class="change-label">持平</span></span>';
    } else {
      changeHtml = '<span class="book-change same"><span class="change-num">—</span><span class="change-label">—</span></span>';
    }

    const tagsHtml = (b.all_tags || []).map((t, i) => 
      `<span class="book-tag ${i === 0 ? 'primary' : ''}">${t}</span>`
    ).join('');

    const genderLabel = b.gender || b.channel || '';
    const scoreLabel = b.score_display ? ` · 积分 ${b.score_display}` : '';

    const daysNum = b.history_days || 1;
    const daysHtml = `<div class="book-days" title="累计上榜 ${daysNum} 天"><span class="days-num">${daysNum}</span><span class="days-label">天</span></div>`;

    return `
      <div class="book-item" data-name="${(b.book_name||'').toLowerCase()}" data-author="${(b.author||'').toLowerCase()}" data-gender="${b.gender || b.channel || ''}" data-tag="${b.primary_tag || ''}" data-status="${b.status || ''}" data-change="${b.rank_change}" data-days="${daysNum}">
        <span class="book-rank ${rankClass}">${b.rank}</span>
        <div class="book-info">
          <div class="book-left">
            <div class="book-name"><a href="${b.book_url}" target="_blank">${b.book_name}</a></div>
            <div class="book-meta">
              <span>${b.author}</span>
              ${genderLabel ? `<span class="sep">·</span><span>${genderLabel}</span>` : ''}
              <span class="sep">·</span><span>${b.status || '未知'}</span>
              ${b.word_count ? `<span class="sep">·</span><span>${fmtWc(b.word_count)}</span>` : ''}
              ${platformId === 'fanqie' && b.read_count ? `<span class="sep">·</span><span class="reading-count">${b.read_count}</span>` : ''}
              ${scoreLabel}
            </div>
            ${tagsHtml ? `<div class="book-tags">${tagsHtml}</div>` : ''}
          </div>
          ${b.abstract && b.abstract !== '暂无简介' ? `<div class="book-abstract">${b.abstract}</div>` : ''}
        </div>
        ${daysHtml}
        ${changeHtml}
      </div>
    `;
  }).join('');
}

// ========== 榜单分页（Top200 榜单默认每页 50 本；数据驱动 + 全集过滤） ==========
// 每个需要分页的榜单在此注册：dataKey 取全集 books 的 state 路径；filterControls 为
// 读取过滤条件的 DOM id 前缀（缺省同 listId）；perPage 默认 50。
// 渲染入口统一走 renderPagedBookList(listId, page)，页码状态存 state._pg[listId]。
const PAGED_OPTIONS = {
  fanqie:            { dataKey: 'fanqie',  perPage: 50 },
  jjwxc:             { dataKey: 'jjwxc',   perPage: 50 },
  changpei:          { dataKey: 'changpei', perPage: 50 },
  changpei_purelove_bestseller: { dataKey: 'changpei_purelove_bestseller', perPage: 50, filter: ['search', 'tag'] },
  changpei_purelove_new:        { dataKey: 'changpei_purelove_new',        perPage: 50, filter: ['search', 'tag'] },
  changpei_purelove_completed:  { dataKey: 'changpei_purelove_completed',  perPage: 50, filter: ['search', 'tag'] },
};

function pgState(listId) {
  if (!state._pg) state._pg = {};
  if (!state._pg[listId]) state._pg[listId] = { page: 1 };
  return state._pg[listId];
}

function pagedBooks(listId) {
  const opt = PAGED_OPTIONS[listId];
  // 历史回看时 _pgSrc 存的是临时全集（优先生效）；否则从 state.data 对应 key 读取
  if (state._pgSrc?.[listId]) return state._pgSrc[listId].slice();
  const data = state.data[opt?.dataKey || listId];
  return (data?.books || []).slice();
}

// 读取该榜单过滤栏当前条件（search-{id}/gender-{id}/tag-{id}/status-{id}…，可存在即读）
function readListFilters(listId) {
  const f = {};
  for (const key of ['search', 'gender', 'tag', 'status', 'year']) {
    const el = document.getElementById(`${key}-${listId}`);
    if (el) f[key] = key === 'search' ? (el.value || '').toLowerCase() : (el.value || '');
  }
  const newBtn = document.getElementById(`newonly-${listId}`);
  f.newOnly = newBtn ? newBtn.classList.contains('active') : false;
  const sort = state._sort?.[listId];
  f.sortKey = sort?.key || null;
  f.sortDir = sort?.dir || 'desc';
  return f;
}

function filterPagedBooks(listId, books) {
  const f = readListFilters(listId);
  let arr = books.filter(b => {
    if (f.search) {
      const n = (b.book_name || '').toLowerCase();
      const a = (b.author || '').toLowerCase();
      if (!n.includes(f.search) && !a.includes(f.search)) return false;
    }
    if (f.gender) {
      const g = (b.gender || b.channel || '');
      if (g !== f.gender) return false;
    }
    if (f.tag && (b.primary_tag || '') !== f.tag) return false;
    if (f.status && (b.status || '') !== f.status) return false;
    if (f.year && (b.publish_time || '').slice(0, 4) !== f.year) return false;
    if (f.newOnly && b.rank_change !== 'new') return false;
    return true;
  });
  if (f.sortKey === 'days') {
    arr.sort((a, b) => f.sortDir === 'desc' ? (b.history_days || 0) - (a.history_days || 0) : (a.history_days || 0) - (b.history_days || 0));
  } else if (f.sortKey === 'change') {
    const v = (b) => b.rank_change === 'new' ? Number.POSITIVE_INFINITY : (typeof b.rank_change === 'number' ? b.rank_change : 0);
    arr.sort((a, b) => f.sortDir === 'desc' ? v(b) - v(a) : v(a) - v(b));
  } else {
    arr.sort((a, b) => (a.rank || 0) - (b.rank || 0));
  }
  return arr;
}

function renderPagedBookList(listId, page) {
  const opt = PAGED_OPTIONS[listId];
  const perPage = opt?.perPage || 50;
  const st = pgState(listId);
  const all = filterPagedBooks(listId, pagedBooks(listId));
  const totalPages = Math.max(1, Math.ceil(all.length / perPage));
  if (page) st.page = Math.min(Math.max(1, page), totalPages);
  const cur = st.page;
  const start = (cur - 1) * perPage;
  const slice = all.slice(start, start + perPage);
  const listEl = document.getElementById(`bookList-${listId}`);
  if (listEl) listEl.innerHTML = renderBookList(slice, listId);
  const pgEl = document.getElementById(`pager-${listId}`);
  if (pgEl) {
    let h = `<button class="pagination-btn" ${cur===1?'disabled':''} onclick="goBookPage('${listId}', ${cur-1})">‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      h += `<button class="pagination-btn ${i===cur?'active':''}" onclick="goBookPage('${listId}', ${i})">${i}</button>`;
    }
    h += `<button class="pagination-btn" ${cur===totalPages?'disabled':''} onclick="goBookPage('${listId}', ${cur+1})">›</button>`;
    pgEl.innerHTML = h;
  }
  const infoEl = document.getElementById(`pagerInfo-${listId}`);
  if (infoEl) infoEl.textContent = `共 ${all.length} 本 · 第 ${cur}/${totalPages} 页 · 每页 ${perPage} 本`;
}

function goBookPage(listId, page) {
  if (!PAGED_OPTIONS[listId]) return;
  renderPagedBookList(listId, page);
}

// 供榜单初次渲染/历史切换调用：注册 + 渲染第 1 页
function initPagedList(listId, booksSource) {
  if (!PAGED_OPTIONS[listId]) return;
  const opt = PAGED_OPTIONS[listId];
  if (booksSource) {
    // 局部 data（非 state.data）时临时注入一个可读源
    if (!state._pgSrc) state._pgSrc = {};
    state._pgSrc[listId] = booksSource;
  }
  pgState(listId).page = 1;
  renderPagedBookList(listId);
}

// 兼容现有 filterBooks：PAGED 榜单 → 数据驱动重绘（重置到第1页 + 应用过滤/排序）；
// 非 PAGED（如 jjwxc_score / qidian_coll 千级 DOM）→ 保留原 DOM show/hide 逻辑。
function isPagedList(platformId) { return !!PAGED_OPTIONS[platformId]; }

function applyListFilters(platformId) {
  if (isPagedList(platformId)) {
    pgState(platformId).page = 1;
    renderPagedBookList(platformId);
    return true;
  }
  return false;
}

function filterBooks(platformId) {
  // Top200 分页榜：数据驱动全集过滤（跨页搜索/筛选都有效），不走 DOM show/hide
  if (isPagedList(platformId)) {
    applyListFilters(platformId);
    return;
  }

  const search = (document.getElementById(`search-${platformId}`)?.value || '').toLowerCase();
  const gender = document.getElementById(`gender-${platformId}`)?.value || '';
  const tag = document.getElementById(`tag-${platformId}`)?.value || '';
  const status = document.getElementById(`status-${platformId}`)?.value || '';
  const year = document.getElementById(`year-${platformId}`)?.value || '';
  const newOnlyBtn = document.getElementById(`newonly-${platformId}`);
  const newOnly = newOnlyBtn?.classList.contains('active') || false;

  const listEl = document.getElementById(`bookList-${platformId}`);
  const items = listEl.querySelectorAll('.book-item');
  items.forEach(el => {
    const name = el.dataset.name || '';
    const author = el.dataset.author || '';
    const elGender = el.dataset.gender || '';
    const elTag = el.dataset.tag || '';
    const elStatus = el.dataset.status || '';
    const elChange = el.dataset.change || '';
    const elYear = el.dataset.year || '';

    let show = true;
    if (search && !name.includes(search) && !author.includes(search)) show = false;
    if (gender && elGender !== gender) show = false;
    if (tag && elTag !== tag) show = false;
    if (status && elStatus !== status) show = false;
    if (year && elYear !== year) show = false;
    if (newOnly && elChange !== 'new') show = false;

    el.style.display = show ? '' : 'none';
  });

  // 应用当前排序状态（如果有）
  applySortOrder(platformId);
}

// 排序状态：state._sort[platformId] = { key: 'days'|'change'|null, dir: 'desc'|'asc' }
function toggleSort(platformId, key) {
  if (!state._sort) state._sort = {};
  const cur = state._sort[platformId] || { key: null, dir: 'desc' };
  let next;
  if (cur.key !== key) {
    // 切到新维度，默认 desc（持续力/涨幅大的在前）
    next = { key, dir: 'desc' };
  } else if (cur.dir === 'desc') {
    next = { key, dir: 'asc' };
  } else {
    // 已经 asc → 取消排序，恢复 rank 原序
    next = { key: null, dir: 'desc' };
  }
  state._sort[platformId] = next;

  // 更新按钮视觉
  const daysBtn = document.getElementById(`sortdays-${platformId}`);
  const changeBtn = document.getElementById(`sortchange-${platformId}`);
  if (daysBtn) {
    daysBtn.classList.toggle('sort-active', next.key === 'days');
    daysBtn.textContent = next.key === 'days'
      ? (next.dir === 'desc' ? '📅 上榜天数 ↓' : '📅 上榜天数 ↑')
      : '📅 上榜天数';
  }
  if (changeBtn) {
    changeBtn.classList.toggle('sort-active', next.key === 'change');
    changeBtn.textContent = next.key === 'change'
      ? (next.dir === 'desc' ? '📈 昨日涨幅 ↓' : '📈 昨日涨幅 ↑')
      : '📈 昨日涨幅';
  }

  applySortOrder(platformId);
}

function applySortOrder(platformId) {
  const listEl = document.getElementById(`bookList-${platformId}`);
  if (!listEl) return;
  // Top200 分页榜：排序由数据驱动 renderPagedBookList 完成（DOM 排序不适用）
  if (isPagedList(platformId)) {
    applyListFilters(platformId);
    return;
  }
  const sort = state._sort?.[platformId];
  const items = Array.from(listEl.querySelectorAll('.book-item'));

  // 把 data-rank 缓存到 element 上（用于恢复原序）
  items.forEach((el, i) => {
    if (!el.dataset.origIndex) el.dataset.origIndex = String(i);
  });

  let sorted;
  if (!sort || !sort.key) {
    // 恢复原榜单顺序（rank 从低到高）
    sorted = items.slice().sort((a, b) => Number(a.dataset.origIndex) - Number(b.dataset.origIndex));
  } else if (sort.key === 'days') {
    sorted = items.slice().sort((a, b) => {
      const da = Number(a.dataset.days) || 0;
      const db = Number(b.dataset.days) || 0;
      return sort.dir === 'desc' ? db - da : da - db;
    });
  } else if (sort.key === 'change') {
    // 'new' 视为最大值（持续新品关注度高）；null 视为 0；数字按原值
    const rank = (v) => {
      if (v === 'new') return Number.POSITIVE_INFINITY;
      if (v === 'null' || v === '' || v === null || v === undefined) return 0;
      const n = Number(v);
      return isNaN(n) ? 0 : n;
    };
    sorted = items.slice().sort((a, b) => {
      const ra = rank(a.dataset.change);
      const rb = rank(b.dataset.change);
      return sort.dir === 'desc' ? rb - ra : ra - rb;
    });
  }

  // 重排 DOM
  const frag = document.createDocumentFragment();
  sorted.forEach(el => frag.appendChild(el));
  listEl.appendChild(frag);
}

function toggleNewOnly(platformId) {
  const btn = document.getElementById(`newonly-${platformId}`);
  btn.classList.toggle('active');
  filterBooks(platformId);
}

async function loadHistoryData(platformId, date) {
  if (!date) {
    // 恢复当前数据
    const data = state.data[platformId];
    if (data?.books) {
      if (isPagedList(platformId)) {
        renderPagedBookList(platformId, 1);
      } else {
        document.getElementById(`bookList-${platformId}`).innerHTML = renderBookList(data.books, platformId);
      }
    }
    return;
  }
  
  const histData = await loadJSON(`data/${platformId}/history/${date}.json`);
  if (histData?.books) {
    if (isPagedList(platformId)) {
      // 历史数据临时替换源并回第 1 页
      if (!state._pgSrc) state._pgSrc = {};
      state._pgSrc[platformId] = histData.books;
      state._pg[platformId] = { page: 1 };
      renderPagedBookList(platformId, 1);
    } else {
      document.getElementById(`bookList-${platformId}`).innerHTML = renderBookList(histData.books, platformId);
    }
  }
}

/**
 * 通用月度榜单历史加载（起点收藏榜 / 晋江积分榜Top1000）
 * @param {string} dataKey  state.data 里的键，也用作 fallback 当前数据（如 'qidian_collection'）
 * @param {string} value    选中的月份（如 '2026-07'），空则恢复最新版
 * @param {object} opts     { pathPrefix, targetId, renderFn }
 *   pathPrefix: 月度存档目录（如 'data/qidian/collection_history'）
 *   targetId:   书目列表容器 id（如 'qidian_coll'）
 *   renderFn:   渲染函数名（'collection' | 'score'）
 */
async function loadMonthlyHistory(dataKey, value, opts) {
  const listEl = document.getElementById(`bookList-${opts.targetId}`);
  if (!listEl) return;
  const render = (books) => opts.renderFn === 'peak'
    ? renderPeakBookList(books)
    : opts.renderFn === 'score'
    ? renderScoreBookList(books)
    : renderCollectionBookList(books);

  if (!value) {
    const data = state.data[dataKey];
    if (data?.books) listEl.innerHTML = render(data.books);
    return;
  }
  const histData = await loadJSON(`${opts.pathPrefix}/${value}.json`);
  if (histData?.books) listEl.innerHTML = render(histData.books);
}

// 字数展示格式化: 已带"字"则原样(番茄/七猫 "313.1万字"), 否则补"字"统一格式
// 例: 纯数字 "4503"→"4503字"; 带万 "17.03万"→"17.03万字"; "17.03万字"→原样
function fmtWc(w) {
  if (!w && w !== 0) return '';
  const s = String(w).trim();
  if (!s) return '';
  return s.includes('字') ? s : s + '字';
}

// 月份 '2026-07' → '2026年7月'
function fmtMonthLabel(m) {
  if (!m || !/^\d{4}-\d{2}$/.test(m)) return m || '';
  const [y, mo] = m.split('-');
  return `${y}年${parseInt(mo, 10)}月`;
}

// 通用子tab切换：contentId 为平台内容容器（如 'qidianContent'），prefix 为子tab id 前缀（如 'qidian'）
function switchSubTab(contentId, prefix, subTabId) {
  document.querySelectorAll(`#${contentId} .sub-tab-content`).forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`#${contentId} .sub-tab-btn`).forEach(el => el.classList.remove('active'));
  document.getElementById(`${prefix}-sub-${subTabId}`).classList.add('active');
  document.querySelector(`#${contentId} .sub-tab-btn[data-subtab="${subTabId}"]`).classList.add('active');
}

// 巅峰榜 Top30 卡片（横向单行：排名 | 书名+作者 | 标签 | 简介 | 月度涨跌）
function renderPeakBookList(books) {
  return books.map(b => {
    const rankClass = b.rank <= 3 ? `r${b.rank}` : 'rn';
    const tagsHtml = (b.all_tags || []).map((t, i) =>
      `<span class="book-tag ${i === 0 ? 'primary' : ''}">${t}</span>`
    ).join('');
    const absText = (b.abstract && b.abstract !== '暂无简介') ? b.abstract : '';
    let changeHtml = '<span class="score-val" style="opacity:.35">—</span>';
    if (b.rank_change === 'new') changeHtml = '<span class="score-val" style="color:#40c057;">NEW</span>';
    else if (typeof b.rank_change === 'number' && b.rank_change > 0) changeHtml = `<span class="score-val" style="color:#ff6b6b;">↑${b.rank_change}</span>`;
    else if (typeof b.rank_change === 'number' && b.rank_change < 0) changeHtml = `<span class="score-val" style="color:#51cf66;">↓${Math.abs(b.rank_change)}</span>`;
    else if (b.rank_change === 0) changeHtml = '<span class="score-val" style="opacity:.6;">—</span>';

    return `
      <div class="book-item score-item" data-name="${(b.book_name||'').toLowerCase()}" data-author="${(b.author||'').toLowerCase()}" data-gender="${b.gender || ''}" data-tag="${b.primary_tag || ''}" data-status="${b.status || ''}">
        <span class="book-rank ${rankClass}">${b.rank}</span>
        <div class="score-name">
          <div class="book-name"><a href="${b.book_url}" target="_blank">${b.book_name}</a></div>
          <div class="book-meta">
            <span>${b.author}</span>
            ${b.gender && b.gender !== '未知' ? `<span class="sep">·</span><span>${b.gender}</span>` : ''}
            <span class="sep">·</span><span>${b.status || '未知'}</span>
            ${b.word_count ? `<span class="sep">·</span><span>${fmtWc(b.word_count)}</span>` : ''}
            ${b.read_count ? `<span class="sep">·</span><span>${b.read_count}</span>` : ''}
          </div>
        </div>
        <div class="score-tags">${tagsHtml}</div>
        <div class="score-abs" title="${(absText||'').replace(/"/g,'&quot;')}">${absText || '<span style="opacity:.35">——</span>'}</div>
        <div class="score-num">${changeHtml}<span class="score-lbl">较上月</span></div>
      </div>
    `;
  }).join('');
}

function renderCollectionBookList(books) {
  return books.map(b => {
    const rankClass = b.rank <= 3 ? `r${b.rank}` : 'rn';
    const tagsHtml = (b.all_tags || []).map((t, i) =>

    ).join('');
    const genderLabel = b.gender || '';

    return `
      <div class="book-item" data-name="${(b.book_name||'').toLowerCase()}" data-author="${(b.author||'').toLowerCase()}" data-gender="${b.gender || ''}" data-tag="${b.primary_tag || ''}" data-status="${b.status || ''}">
        <span class="book-rank ${rankClass}">${b.rank}</span>
        <div class="book-info">
          <div class="book-left">
            <div class="book-name"><a href="${b.book_url}" target="_blank">${b.book_name}</a></div>
            <div class="book-meta">
              <span>${b.author}</span>
              ${genderLabel ? `<span class="sep">·</span><span>${genderLabel}</span>` : ''}
              <span class="sep">·</span><span>${b.status || '完结'}</span>
              ${b.word_count ? `<span class="sep">·</span><span>${b.word_count}</span>` : ''}
              ${b.collections ? `<span class="sep">·</span><span style="color:#ffd700;">收藏 ${b.collections}</span>` : ''}

    }
  });
}

init();

// ========== 书卡等高对齐（所有书卡格式完全一致） ==========
// 每个 .book-list 内取内容最高的一张卡为基准，其余卡补齐 min-height，
// 简介完整展开不省略（CSS 规则 8），内容顶部对齐、底部统一留白。
function alignBookItems() {
  document.querySelectorAll('.book-list').forEach(list => {
    const items = Array.from(list.querySelectorAll('.book-item'));
    if (items.length < 2) return;
    items.forEach(el => { el.style.minHeight = ''; });           // 先重置再量
    let maxH = 0;
    items.forEach(el => {
      const h = el.offsetHeight;
      if (h > maxH) maxH = h;
    });
    if (maxH > 0) items.forEach(el => { el.style.minHeight = maxH + 'px'; });
  });
}
// 列表是异步渲染 + 切换 tab/筛选/排序/新书按钮会重绘 → 监听 DOM 变化自动对齐（防抖）
const _bookListObserver = new MutationObserver(() => {
  clearTimeout(_bookListObserver._t);
  _bookListObserver._t = setTimeout(alignBookItems, 60);
});
_bookListObserver.observe(document.body, { childList: true, subtree: true });
// 首次数据加载完成兜底
window.addEventListener('load', () => setTimeout(alignBookItems, 400));
setTimeout(alignBookItems, 1200);
</script>

<!-- ===== 长佩三栏题材下钻接入（trio-embed）：替换长佩 4 子榜「细分题材」模块 ===== -->
<script src="data/trio-embed.js"></script>
<script>
(function () {
  // 长佩 4 子榜挂载点 → 各自书级数据（数据现算，无需后端）
  var CP_HOSTS = [
    { id: 'trio-cp-all',       url: 'data/changpei/latest.json' },
    { id: 'trio-cp-purelove',  url: 'data/changpei/purelove_bestseller.json' },
    { id: 'trio-cp-new',       url: 'data/changpei/purelove_new.json' },
    { id: 'trio-cp-completed', url: 'data/changpei/purelove_completed.json' }
  ];
  var CP_COLOR = '#6c5ce7', CP_H = 380;
  function startWatch() {
    if (typeof window.mountTrio !== 'function') { setTimeout(startWatch, 200); return; } // 等 embed 脚本
    var iv = setInterval(function () {
      // 长佩 tab 为懒渲染：挂载点未出现时必须保持轮询，不能提前停
      var allDone = true;
      CP_HOSTS.forEach(function (h) {
        var el = document.getElementById(h.id);
        if (!el) { allDone = false; return; }  // 尚未渲染 → 保持轮询
        if (el.getAttribute('data-mounted')) return; // 已挂
        allDone = false;
        el.setAttribute('data-mounted', '1');   // 先占位防重入（mountTrio 异步）
        window.mountTrio(el, { color: CP_COLOR, height: CP_H, booksUrl: h.url })
          .catch(function (e) { console.log('trio mount fail', h.id, e); el.removeAttribute('data-mounted'); });
      });
      if (allDone) clearInterval(iv);
    }, 300);
    setTimeout(function () { clearInterval(iv); }, 120000); // 保险：2min 后停止轮询
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startWatch);
  else startWatch();
})();
</script>
