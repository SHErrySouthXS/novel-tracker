name: Daily Novel Scrape & Deploy

on:
  schedule:
    # 每天北京时间 02:00 运行 (UTC 18:00)
    - cron: '0 18 * * *'
    # 冗余兜底 05:00 (UTC 21:00)：GitHub schedule 不保证执行且常延迟 3-5h，双触发点提高命中概率；
    # 凌晨时段抓取 = 前一日 24h 热度沉淀后的稳定快照（晋江积分月榜/番茄最热/长佩畅销均为滚动榜，无 0 点日切风险）；
    # 延迟缓冲：02:00 触发即使拖到 05-06 点，08 点前必到位；若 02:00 已跑完，05:00 重抓 diff 为空则不会重复 commit；若仍在跑则被 concurrency 取消重来
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: novel-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # 番茄小说 (原生 HTTP，无需 Playwright；看板只展示女频，爬虫内置 gender=0 女频最热榜)
      - name: Scrape Fanqie (番茄小说·女频最热榜)
        run: node scrapers/fanqie.js
        continue-on-error: true

      # 番茄女频 · 今日流行总结（AI，LLM=小米 MiMo Token Plan；前端横幅与长佩同款）
      - name: Fanqie Trend Summary (今日流行总结)
        run: node scrapers/platform-summary.js fanqie
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro
        continue-on-error: true

      # 晋江文学城 (原生 HTTP)
      - name: Scrape JJWXC (晋江文学城)
        run: node scrapers/jjwxc.js
        continue-on-error: true

      # 晋江月榜 · 今日流行总结（AI，LLM=小米 MiMo Token Plan；前端横幅与长佩同款）
      - name: JJWXC Trend Summary (今日流行总结)
        run: node scrapers/platform-summary.js jjwxc
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro
        continue-on-error: true

      # 长佩文学 (Playwright)
      - name: Scrape Changpei (长佩文学)
        run: node scrapers/changpei.js
        continue-on-error: true
        timeout-minutes: 45

      # 长佩总榜 · 今日流行总结（AI，LLM=小米 MiMo Token Plan；2026-09-09d 起与晋江/七猫/番茄统一走 platform-summary.js，替代原 changpei-summary.js 纯规则词典）
      - name: Changpei Trend Summary (今日流行总结)
        run: node scrapers/platform-summary.js changpei
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro
        continue-on-error: true

      # 七猫小说 (公开API，无需浏览器；看板只展示女频，抓女频 8 榜 → 去重池 pool.json)
      - name: Scrape Qimao (七猫小说·女频 8 榜去重池)
        run: node scrapers/qimao.js --girl
        continue-on-error: true

      # 七猫女频 · 今日流行总结（AI，LLM=小米 MiMo Token Plan；前端横幅与长佩同款）
      - name: Qimao Trend Summary (今日流行总结)
        run: node scrapers/platform-summary.js qimao
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro
        continue-on-error: true

      # 晋江积分榜 Top1000 (每月1号更新 或 手动触发时运行，10页1000本)
      - name: Scrape JJWXC Score1000 (晋江积分榜Top1000)
        run: |
          DOM=$(date -u +%d)
          if [ "$DOM" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running jjwxc score1000 scraper (day=$DOM, event=${{ github.event_name }})"
            node scrapers/jjwxc-score.js
          else
            echo "Skipping jjwxc score1000 scraper (only runs on 1st of month or manual trigger)"
          fi
        continue-on-error: true
        timeout-minutes: 15

      # 番茄巅峰榜 Top30 (每月2号更新 或 手动触发时运行；番茄官网巅峰榜每月1号刷新，2号抓保险)
      - name: Scrape Fanqie Peak (番茄巅峰榜Top30)
        run: |
          DOM=$(date -u +%d)
          if [ "$DOM" = "02" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running fanqie peak scraper (day=$DOM, event=${{ github.event_name }})"
            node scrapers/fanqie-rank.js
          else
            echo "Skipping fanqie peak scraper (only runs on 2nd of month or manual trigger)"
          fi
        continue-on-error: true
        timeout-minutes: 10

      # AI 智能分析
      - name: AI Analysis (概览深度分析)
        run: node scrapers/analyze.js
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro
        continue-on-error: true

      - name: Commit & Push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "📊 update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Handle potential conflicts from concurrent pushes
          for i in 1 2 3; do
            git push && break
            echo "Push failed, attempt $i. Pulling and retrying..."
            git pull --rebase origin main --strategy-option=theirs || true
            sleep 2
          done

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest data
        run: git pull origin main

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - uses: actions/deploy-pages@v4
